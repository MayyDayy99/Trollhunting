name: Deploy single-player to GitHub Pages

# Builds the single-file game (npm run build -> dist/mohas-roham.html) and
# publishes ONLY that file to Pages, as index.html. Co-op is intentionally not
# hosted here — it needs the WebSocket server in mp-server/ (see README).

on:
  push:
    branches: [main]
    paths:
      - 'mohas-roham.html'
      - 'src/**'
      - 'build/**'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress: false — ha a GitHub Pages deploy-sora torlódik, egy újabb
# push NE lője le a már sorban álló deploymentet (különben sosem ér a sor végére).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit + build tests
        run: npm test
      - name: Build the single-file game
        run: npm run build
      - name: Assemble site (single-player only)
        run: |
          mkdir -p _site
          cp dist/mohas-roham.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
